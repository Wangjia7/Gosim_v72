schema_version: 1
experiment_id: gosim-pro-normal-v32-conservative
project_id: astronomy-observer-v32
parent_run_id: null
hypothesis: Cached common-program search and deadline protection can improve some
  normal cases within CPU budget; universal nonregression is tested, not assumed.
baseline: paired official python-pro runs in selected-results.json
command: python3 cpu_matrix.py; python3 cpu_followup.py; python3 cpu_minimal.py; python3
  cpu_repaired.py; python3 cpu_windows.py
output_dir: evidence/final
data_contract_revision: DATA_CONTRACT.md v32
datasets:
- name: L1 L2 sparse and two new normal seeds
  version: v32 frozen products
  uri: per-run source-input-manifest.json
  identity: 85d7f2181c2631e6a2c182adc9f85950d0b2f64b933e3d594680b172e75b13d3
random:
  stochastic: true
  seed: 2026100617
  rng: official generator random.Random; per-case seeds/product hashes preserved
  stream_policy: identical frozen target/weather/request products in each pair; no
    runtime RNG; adaptive timing nondeterministic
parallel:
  backend: serial charged runs; passive supervisors and occasional unit tests on host
  workers: 1
  threads_per_worker: 1
  reduction: serial per fibre
environment:
  dependency_lock: dependency-lock.txt
  hardware: x86_64
  software: 3.10.9 stdlib; C++17; official scorer; local process CPU hook
parameters:
  normal_preset:
    JOINT_PROGRAM: 1
    FULL_FIELD: 0
    BREAKPOINTS: 0
    REQUEST_BATCH: 0
    CONSERVATIVE_REQUIRED: 0
    WINDOW_URGENCY: 0
  api: false
  standard_cpu_budget: 180
controls:
  sample_ids: fixed public target IDs per pair
  skeleton: not-applicable; telescope schedule
  selection: all named pairs with gains/regressions retained; selection after development
    results, no blind final holdout
  units_and_coordinates: UTC/degrees, public alt-az gnomonic mapping
  bin_edges_and_denominator: one official total per complete task card
metrics:
  total_points:
    definition: total_points from official final score/fair clock
    unit: points
    uncertainty: one run per card; OS pacing variance not estimated
  paired_delta:
    definition: paired_delta from official final score/fair clock
    unit: points
    uncertainty: one run per card; OS pacing variance not estimated
  required_missing:
    definition: required_missing from official final score/fair clock
    unit: count
    uncertainty: one run per card; OS pacing variance not estimated
  cpu_charged:
    definition: cpu_charged from official final score/fair clock
    unit: standard_cpu_seconds
    uncertainty: one run per card; OS pacing variance not estimated
reproducibility:
  level: numerical
  tolerance: saved action traces exactly scoreable; adaptive reruns need not produce
    identical actions
success_criterion: legal complete episodes, interface checks, retain regressions;
  no universal score threshold claimed
budget:
  max_runs: 32
  max_walltime_hours: 1
  stop_condition: planned source/switch comparisons and ZIP verification complete;
    stop further tuning
