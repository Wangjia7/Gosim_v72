schema_version: 1
experiment_id: gosim-desi-final-layout-regression
project_id: astronomy-observer-v300
parent_run_id: null
hypothesis: Window, raw-bound and geometry safeguards execute under official interface/CPU
  budget; unknown-layout nonregression is evaluated, not assumed.
baseline: official python-pro in experiments/matrix-results-v2.json
command: /Library/Developer/CommandLineTools/usr/bin/python3 run_request_guard.py
output_dir: evidence/final-series
data_contract_revision: DATA_CONTRACT.md v300
datasets:
- name: corrected synthetic layouts
  version: v2
  uri: cases-v2
  identity: b0f0461e4a367f85107149f70ae47a6b0f797a11465f584c0d721554d27f9745
random:
  stochastic: true
  seed: 202610061
  rng: official Python random.Random MT19937; individual seeds in case manifest
  stream_policy: same frozen generated catalogue/weather/request products per baseline/candidate
    pair
parallel:
  backend: serial inside each matrix; independent L1/long processes on host
  workers: 1
  threads_per_worker: 1
  reduction: no threaded numeric reduction
environment:
  dependency_lock: dependency-lock.txt
  hardware: arm64
  software: 3.9.6 stdlib; C++17; PyYAML used only for registry
parameters:
  api: false
  standard_cpu_budget: 120
  final_source_manifest: request-guard-source-frozen.json
controls:
  sample_ids: identical target IDs within each paired card
  skeleton: not-applicable; telescope scheduler
  selection: all corrected cases; preserve both gains and regressions
  units_and_coordinates: UTC and degrees; gnomonic Alt-Az as public engine
  bin_edges_and_denominator: one total per task card; no selected-target renormalization
metrics:
  totals:
    definition: totals from full official score_report/fair_clock
    unit: points
    uncertainty: single per-case measurement; OS pacing variation not estimated
  required_missing:
    definition: required_missing from full official score_report/fair_clock
    unit: count
    uncertainty: single per-case measurement; OS pacing variation not estimated
  requests_completed:
    definition: requests_completed from full official score_report/fair_clock
    unit: count
    uncertainty: single per-case measurement; OS pacing variation not estimated
  cpu_charged:
    definition: cpu_charged from full official score_report/fair_clock
    unit: standard_cpu_seconds
    uncertainty: single per-case measurement; OS pacing variation not estimated
reproducibility:
  level: numerical
  tolerance: exact scorer for saved action trace; fresh adaptive run action identity
    not guaranteed
success_criterion: Interface/legal actions/no CPU expiry; no universal score nonregression
  assumed
budget:
  max_runs: 8
  max_walltime_hours: 1
  stop_condition: six corrected paired-input candidate runs plus long and L1 regression;
    retain failures
