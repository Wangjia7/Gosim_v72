schema_version: 1
experiment_id: gosim-inspection-v35
project_id: astronomy-observer
parent_run_id: null
hypothesis: Realized inspection prevents invalid/duplicate credit and provides bounded
  noncausal QA without score regression on fixed public workloads.
baseline: immutable v3.4 exact final source
command: run_cpu.py --family <baseline|candidate> --card <normal-b|long-held> --out
  <unique> --budget 900 --wall-cap 7200
output_dir: evidence/final
data_contract_revision: DATA_CONTRACT-v35
datasets:
- name: normal-b and 180-night/6000-target long-held
  version: frozen official v4 and prior generated cards
  uri: ../gosim-desi-v300/cases-v2/long-held and official local-cards/L1
  identity: per-run full input SHA256 manifests; no runtime engine truth reads
random:
  stochastic: false
  seed: null
  rng: agent deterministic, inputs pre-generated and frozen
  stream_policy: same fixed truth/weather/catalogue per paired run; CPU adaptation
    can alter paths
parallel:
  backend: independent host processes across cards; serial agent/scorer per run
  workers: 1
  threads_per_worker: 1
  reduction: serial C++ fibre selection
environment:
  dependency_lock: dependency-lock.txt
  hardware: macOS arm64 host
  software: bundled Python3.12.14 stdlib, C++17, frozen official workflow and process
    CPU hook
parameters:
  cpu_budget_seconds: 900
  local_wall_protection_seconds: 7200
  log_checkpoint_exposures: 8
  recent_exposure_window: 64
  max_search_breadth: 1
  api: false
  switch_names:
    FUSION_LOG_REVIEW: '1'
    FUSION_MAX_BREADTH: '1'
controls:
  sample_ids: fixed public target IDs per card; own observe indices in audit
  skeleton: 'not-applicable: telescope scheduling'
  selection: Two fixed paired workloads; no score tuning; D1 unavailable. Timed adaptive
    paths may differ. Initial candidate long scored lower; preserve and report it.
    Added QA-only replay-credit correction after finding that a surviving exposure
    can recover marginal credit when an earlier high score is invalidated. Recheck
    final source, not select the best run.
  units_and_coordinates: UTC/degrees; normalized standard CPU and raw host CPU kept
    separate
  bin_edges_and_denominator: one official total per card and algorithm
metrics:
  paired_scores:
    definition: official totals and counts for baseline and candidate normal-b/long-held
    unit: score
    uncertainty: single fixed pair each; no variance estimate
  tests:
    definition: passed regression and fixed visit checks
    unit: count
    uncertainty: conformance
  zip_valid:
    definition: fresh extraction build JSONL and fallback
    unit: boolean
    uncertainty: single macOS host
reproducibility:
  level: numerical
  tolerance: recorded action traces/score files exact; timed adaptive reruns can differ
success_criterion: complete legal episodes without mistaking engine/model waits for
  own CPU; test/build/protocol pass; report score tradeoffs
budget:
  max_runs: 6
  max_walltime_hours: 1
  stop_condition: four initial runs plus exact-final normal-b/long-held after QA replay
    credit correction; no score tuning
